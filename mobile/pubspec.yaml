name: halalbizs
description: "HalalBizs — halal marketplace app for buyers and sellers (iOS, Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Dependencies per the mobile plan §6. Every one is justified in the PR that
# added it; feature slices do not add packages without noting why.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.2
  connectivity_plus: ^7.3.2
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  collection: ^1.19.1
  image_picker: ^1.2.4
  cached_network_image: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/img/
  # Souk type: Newsreader (display), Instrument Sans (body), IBM Plex Mono
  # (prices, ids). Static OFL builds from Google Fonts; licences beside them.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Launcher icons from the khatam mark on paper — regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/khatam-1024.png
  android: true
  adaptive_icon_background: "#FAF7F1"
  adaptive_icon_foreground: assets/icon/khatam-1024.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FAF7F1"
  web:
    generate: true
    background_color: "#FAF7F1"
    theme_color: "#22572F"

# Native splash: khatam on paper — regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAF7F1"
  image: assets/icon/khatam-1024.png
  android_12:
    color: "#FAF7F1"
    image: assets/icon/khatam-1024.png
  android: true
  ios: true
  web: false
  fullscreen: false
